[package]
name = "rbh-label-fonts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rbh-labels = { path = "../rbh-labels" }
vectorcraft-text = { workspace = true }
vectorcraft-doc = { workspace = true }
vectorcraft-geom = { workspace = true }
serde_json = { workspace = true }
qrcodegen = "1.8.0"

# The integration tests use bundled Source Sans 3 as an open-licensed fixture.
# Production continues to require an exact local Helvetica Neue Bold match.
[dev-dependencies]
vectorcraft-text = { workspace = true, features = ["bundled-fonts"] }
